<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cool Photo Compressor</title>
  <style>
    /* Cool Dark Gradient Animated Background */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(-45deg, #0f172a, #1e1b4b, #311042, #0f172a);
      background-size: 400% 400%;
      animation: gradientBG 12s ease infinite;
      color: #f8fafc;
      padding: 20px;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Glassmorphism Container Card */
    .container {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 30px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      text-align: center;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #a855f7, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-bottom: 25px;
    }

    .upload-box {
      border: 2px dashed #6366f1;
      border-radius: 12px;
      padding: 30px 15px;
      cursor: pointer;
      transition: all 0.3s ease;
      background: rgba(99, 102, 241, 0.05);
    }

    .upload-box:hover {
      background: rgba(99, 102, 241, 0.15);
      border-color: #a855f7;
    }

    .upload-box p {
      color: #cbd5e1;
      font-weight: 500;
    }

    input[type="file"] {
      display: none;
    }

    .preview-img {
      max-width: 100%;
      max-height: 200px;
      border-radius: 10px;
      margin-top: 20px;
      display: none;
      object-fit: contain;
    }

    .controls {
      margin-top: 25px;
      display: none;
    }

    .slider-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .slider-group label {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      color: #cbd5e1;
      margin-bottom: 8px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #ec4899;
      cursor: pointer;
    }

    .stats {
      display: flex;
      justify-content: space-around;
      background: rgba(0, 0, 0, 0.2);
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 0.85rem;
    }

    .stat-item span {
      display: block;
      color: #38bdf8;
      font-weight: bold;
      font-size: 0.95rem;
      margin-top: 4px;
    }

    .download-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(90deg, #6366f1, #a855f7);
      color: #fff;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .download-btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>⚡ Image Shrink</h1>
    <p class="subtitle">Compress photos in seconds right in your browser</p>

    <div class="upload-box" onclick="document.getElementById('imageInput').click()">
      <p>📸 Click to select or drop photo here</p>
      <input type="file" id="imageInput" accept="image/*">
    </div>

    <img id="preview" class="preview-img" alt="Preview">

    <div class="controls" id="controls">
      <div class="slider-group">
        <label>
          <span>Compression Level:</span>
          <span id="qualityVal">70%</span>
        </label>
        <input type="range" id="qualitySlider" min="5" max="100" value="70">
      </div>

      <div class="stats">
        <div class="stat-item">
          Original Size
          <span id="origSize">0 KB</span>
        </div>
        <div class="stat-item">
          Compressed Size
          <span id="compSize">0 KB</span>
        </div>
      </div>

      <button class="download-btn" id="downloadBtn">Download Photo</button>
    </div>
  </div>

  <script>
    const imageInput = document.getElementById('imageInput');
    const qualitySlider = document.getElementById('qualitySlider');
    const qualityVal = document.getElementById('qualityVal');
    const controls = document.getElementById('controls');
    const preview = document.getElementById('preview');
    const origSize = document.getElementById('origSize');
    const compSize = document.getElementById('compSize');
    const downloadBtn = document.getElementById('downloadBtn');

    let originalFile = null;
    let compressedBlob = null;

    imageInput.addEventListener('change', (e) => {
      originalFile = e.target.files[0];
      if (!originalFile) return;

      origSize.textContent = formatBytes(originalFile.size);
      
      const reader = new FileReader();
      reader.onload = (event) => {
        preview.src = event.target.result;
        preview.style.display = 'block';
        controls.style.display = 'block';
        compressImage();
      };
      reader.readAsDataURL(originalFile);
    });

    qualitySlider.addEventListener('input', () => {
      qualityVal.textContent = `${qualitySlider.value}%`;
      compressImage();
    });

    function compressImage() {
      if (!originalFile) return;

      const img = new Image();
      img.src = preview.src;
      img.onload = () => {
        // Use HTML5 Canvas to re-render and compress image quality
        const canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = img.height;

        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

        const quality = qualitySlider.value / 100;

        canvas.toBlob((blob) => {
          compressedBlob = blob;
          compSize.textContent = formatBytes(blob.size);
        }, 'image/jpeg', quality);
      };
    }

    downloadBtn.addEventListener('click', () => {
      if (!compressedBlob) return;
      const link = document.createElement('a');
      link.href = URL.createObjectURL(compressedBlob);
      link.download = `compressed_${originalFile.name.split('.')[0]}.jpg`;
      link.click();
    });

    function formatBytes(bytes) {
      if (bytes === 0) return '0 Bytes';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }
  </script>
</body>
</html>
