<html lang="en">

  <style>
    /* Cool Blue & Black Animated Background */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      /* Black to Deep Blue Gradient */
      background: linear-gradient(-45deg, #000000, #0a192f, #0f172a, #000000);
      background-size: 400% 400%;
      animation: gradientBG 12s ease infinite;
      color: #f8fafc;
      padding: 40px 20px;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Larger Glassmorphism Container for PC */
    .container {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 24px;
      padding: 50px 40px;
      max-width: 650px; /* Increased width for computer screens */
      width: 100%;
      box-shadow: 0 10px 40px 0 rgba(0, 0, 0, 0.6);
      text-align: center;
    }

    h1 {
      font-size: 2.8rem; /* Much larger heading */
      margin-bottom: 12px;
      /* Bright Blue Gradient Text */
      background: linear-gradient(90deg, #38bdf8, #2563eb);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      font-size: 1.2rem; /* Larger subtitle */
      color: #94a3b8;
      margin-bottom: 35px;
    }

    .upload-box {
      border: 2px dashed #38bdf8; /* Blue border */
      border-radius: 16px;
      padding: 50px 20px; /* Taller drag-and-drop box */
      cursor: pointer;
      transition: all 0.3s ease;
      background: rgba(56, 189, 248, 0.05);
    }

    .upload-box:hover {
      background: rgba(56, 189, 248, 0.15);
      border-color: #60a5fa;
    }

    .upload-box p {
      color: #e2e8f0;
      font-weight: 500;
      font-size: 1.3rem; /* Larger upload text */
    }

    input[type="file"] {
      display: none;
    }

    .preview-img {
      max-width: 100%;
      max-height: 350px; /* Larger image preview */
      border-radius: 12px;
      margin-top: 30px;
      display: none;
      object-fit: contain;
    }

    .controls {
      margin-top: 35px;
      display: none;
    }

    .slider-group {
      margin-bottom: 30px;
      text-align: left;
    }

    .slider-group label {
      display: flex;
      justify-content: space-between;
      font-size: 1.1rem; /* Larger slider labels */
      color: #cbd5e1;
      margin-bottom: 12px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #38bdf8; /* Blue slider handle */
      cursor: pointer;
      height: 8px; /* Thicker slider line */
    }

    .stats {
      display: flex;
      justify-content: space-around;
      background: rgba(0, 0, 0, 0.4);
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 30px;
      font-size: 1.1rem; /* Larger stats text */
    }

    .stat-item span {
      display: block;
      color: #38bdf8; /* Blue numbers */
      font-weight: bold;
      font-size: 1.4rem; /* Much larger file size numbers */
      margin-top: 8px;
    }
